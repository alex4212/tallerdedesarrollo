name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inyectar variables de entorno Frontend
        run: |
          if [ -f ~/frontend.env ]; then
            cp ~/frontend.env ./frontend/.env.production
          else
            echo "Advertencia: ~/frontend.env no existe en el home del runner"
          fi

      - name: Instalar y construir Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Desplegar Frontend con PM2
        run: |
          npx pm2 restart api-frontend || npx pm2 serve ./frontend/dist 80 --name "api-frontend" --spa
          npx pm2 save

      - name: Inyectar variables de entorno Backend
        run: |
          mkdir -p ./backend/src/config
          if [ -f ~/backend.env ]; then
            cp ~/backend.env ./backend/src/config/.env
          else
            echo "Advertencia: ~/backend.env no existe en el home del runner"
          fi

      - name: Instalar dependencias del Backend
        run: |
          cd backend
          npm install

      - name: Reiniciar Backend con PM2
        run: |
          # Liberar puerto 1626 si algún proceso huérfano quedó bloqueándolo
          fuser -k 1626/tcp || true
          sleep 2
          npx pm2 restart api-backend --update-env || npx pm2 start src/index.js --name "api-backend" --cwd "$GITHUB_WORKSPACE/backend"
          npx pm2 save
