name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del Backend
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          npm install

      - name: Instalar y construir Frontend
        run: |
          source ~/.nvm/nvm.sh
          cd frontend
          npm install
          npm run build

      - name: Limpiar procesos antiguos de PM2 (liberar el puerto)
        run: |
          source ~/.nvm/nvm.sh
          pm2 delete api-frontend || true
          pm2 save

      - name: Inyectar variables de entorno Backend
        run: cp ~/backend.env ./backend/.env

      - name: Iniciar Backend unificado con PM2
        run: |
          source ~/.nvm/nvm.sh
          cd backend
          PORT=80 setsid pm2 restart api-backend --update-env || PORT=80 setsid pm2 start $GITHUB_WORKSPACE/backend/src/index.js --name "api-backend"
          pm2 save

    