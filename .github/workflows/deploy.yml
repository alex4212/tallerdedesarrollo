name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inyectar variables de entorno Frontend
        run: |
          if [ -f ~/frontend.env ]; then
            cp ~/frontend.env ./frontend/.env.production
          else
            echo "Advertencia: ~/frontend.env no existe en el home del runner"
          fi

      - name: Instalar y construir Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Inyectar variables de entorno Backend
        run: |
          mkdir -p ./backend/src/config
          if [ -f ~/backend.env ]; then
            cp ~/backend.env ./backend/src/config/.env
          else
            echo "Advertencia: ~/backend.env no existe en el home del runner"
          fi

          
      - name: Instalar dependencias del Backend
        run: |
          cd backend
          npm install

      - name: Desplegar Backend con PM2 (servidor único en puerto 1626)
        run: |
          # Eliminar permanentemente api-frontend para que no interfiera
          npx pm2 delete api-frontend 2>/dev/null || true
          # Liberar el puerto 1626 si hubiese un proceso colgado
          pkill -f 1626 2>/dev/null || true
          sleep 1
          # Reiniciar o iniciar api-backend (sirve tanto la API /api como el Frontend)
          npx pm2 restart api-backend --update-env || npx pm2 start src/index.js --name "api-backend" --cwd "$GITHUB_WORKSPACE/backend"
          npx pm2 save
